Tests: Build and Test DryFish.ILib

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Cho phép chạy manual

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet: ['6.0.x', '7.0.x', '8.0.x']
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: macos-latest
            dotnet: '6.0.x' # Không test .NET 6 trên macOS
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
    
    - name: Restore dependencies
      run: dotnet restore DryFish.ILib.sln
    
    - name: Build
      run: dotnet build DryFish.ILib.sln --configuration Release --no-restore --verbosity minimal
    
    - name: Test
      run: dotnet test src/test/DryFish.ILib.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
    
    - name: Pack NuGet
      run: dotnet pack src/main/DryFish.ILib.csproj --configuration Release --no-build --output ./nupkg
    
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ matrix.dotnet }}-${{ matrix.os }}
        path: ./nupkg/*.nupkg
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
    
    - name: Pack NuGet with version
      run: dotnet pack src/main/DryFish.ILib.csproj --configuration Release -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output ./nupkg
    
    - name: Publish to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./nupkg/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-compatibility:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test on .NET Framework (Windows only)
      run: |
        echo "Testing on different frameworks"
        dotnet test src/test/DryFish.ILib.Tests.csproj --framework net48 2>/dev/null || echo "net48 not supported"
