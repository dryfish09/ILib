name: Build and Test DryFish.ILib

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore
      run: dotnet restore src/main/DryFish.ILib.csproj
    
    - name: Build
      run: dotnet build src/main/DryFish.ILib.csproj --configuration Release --no-restore
    
    - name: Test
      run: dotnet test src/test/DryFish.ILib.Test.csproj --configuration Release --no-build --verbosity normal
    
    - name: Pack
      run: dotnet pack src/main/DryFish.ILib.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts
    
    - name: Get version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
    
    - name: Pack with version
      run: |
        dotnet pack src/main/DryFish.ILib.csproj \
          --configuration Release \
          -p:PackageVersion=${{ env.VERSION }} \
          --output ./artifacts
    
    - name: Push to NuGet
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        name: Release v${{ env.VERSION }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
