name: Build, Test, and Publish DryFish.ILib

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - latest
      version_suffix:
        description: 'Version suffix (e.g., beta1, rc1) - only for prerelease'
        required: false
        default: 'beta1'
        type: string
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      create_tag:
        description: 'Create git tag for this version'
        required: false
        default: true
        type: boolean
      tag_message:
        description: 'Tag message (optional)'
        required: false
        type: string

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ['net8.0', 'net7.0', 'net6.0', 'net48']
        exclude:
          - os: macos-latest
            framework: 'net48'
          - os: ubuntu-latest
            framework: 'net48'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore src/main/DryFish.ILib.csproj
    
    - name: Build
      run: dotnet build src/main/DryFish.ILib.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore
    
    - name: Test
      if: github.event.inputs.skip_tests != 'true' && (matrix.framework != 'net48' || runner.os == 'Windows')
      run: dotnet test src/test/DryFish.ILib.Test.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --verbosity normal

  create-tag:
    name: Create Git Tag
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.create_tag == 'true'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      version: ${{ steps.get_version.outputs.VERSION }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get version
      id: get_version
      run: |
        YEAR=$(date +'%Y')
        MONTH=$(date +'%-m')
        DAY=$(date +'%-d')
        
        if [ "${{ github.event.inputs.release_type }}" == "latest" ]; then
          VERSION="${YEAR}.${MONTH}.${DAY}"
        else
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          VERSION="${YEAR}.${MONTH}.${DAY}-${SUFFIX}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Check if tag exists
      id: check_tag
      run: |
        TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
          echo "Tag $TAG_NAME already exists"
        else
          echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          echo "Tag $TAG_NAME does not exist"
        fi
    
    - name: Configure git
      if: steps.check_tag.outputs.TAG_EXISTS == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create tag
      if: steps.check_tag.outputs.TAG_EXISTS == 'false'
      id: create_tag
      run: |
        TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
        TAG_MSG="${{ github.event.inputs.tag_message }}"
        
        if [ -z "$TAG_MSG" ]; then
          TAG_MSG="Release $TAG_NAME"
          if [ "${{ github.event.inputs.release_type }}" == "prerelease" ]; then
            TAG_MSG="$TAG_MSG (prerelease)"
          fi
        fi
        
        git tag -a "$TAG_NAME" -m "$TAG_MSG"
        git push origin "$TAG_NAME"
        echo "Created and pushed tag: $TAG_NAME"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
    
    - name: Tag already exists warning
      if: steps.check_tag.outputs.TAG_EXISTS == 'true'
      run: |
        echo "::warning::Tag ${{ steps.get_version.outputs.TAG_NAME }} already exists. Skipping tag creation."

  pack:
    name: Pack NuGet
    needs: [build-and-test, create-tag]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Use the same version from create-tag or generate new
          if [ -n "${{ needs.create-tag.outputs.version }}" ]; then
            VERSION="${{ needs.create-tag.outputs.version }}"
          else
            YEAR=$(date +'%Y')
            MONTH=$(date +'%-m')
            DAY=$(date +'%-d')
            if [ "${{ github.event.inputs.release_type }}" == "latest" ]; then
              VERSION="${YEAR}.${MONTH}.${DAY}"
            else
              SUFFIX="${{ github.event.inputs.version_suffix }}"
              VERSION="${YEAR}.${MONTH}.${DAY}-${SUFFIX}"
            fi
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=${{ github.event.inputs.release_type == 'prerelease' }}" >> $GITHUB_OUTPUT
        else
          # For tag push, use tag version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            # For branch push, use date-based prerelease
            YEAR=$(date +'%Y')
            MONTH=$(date +'%-m')
            DAY=$(date +'%-d')
            VERSION="${YEAR}.${MONTH}.${DAY}-preview"
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
        fi
    
    - name: Pack NuGet package
      run: |
        dotnet pack src/main/DryFish.ILib.csproj \
          --configuration Release \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          --output ./artifacts
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg

  publish:
    name: Publish to NuGet
    needs: pack
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'latest')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./artifacts
    
    - name: Get version info
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          YEAR=$(date +'%Y')
          MONTH=$(date +'%-m')
          DAY=$(date +'%-d')
          VERSION="${YEAR}.${MONTH}.${DAY}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        else
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Pack with version
      run: |
        dotnet pack src/main/DryFish.ILib.csproj \
          --configuration Release \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          --output ./artifacts
    
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        name: Release v${{ steps.get_version.outputs.VERSION }}
        prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE == 'true' }}
        tag_name: v${{ steps.get_version.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-prerelease:
    name: Publish Prerelease to NuGet
    needs: pack
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.release_type == 'prerelease'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./artifacts
    
    - name: Get version info
      id: get_version
      run: |
        if [ -n "${{ needs.create-tag.outputs.version }}" ]; then
          VERSION="${{ needs.create-tag.outputs.version }}"
        else
          YEAR=$(date +'%Y')
          MONTH=$(date +'%-m')
          DAY=$(date +'%-d')
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          VERSION="${YEAR}.${MONTH}.${DAY}-${SUFFIX}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Publish prerelease to NuGet.org
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Create GitHub Prerelease
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
        name: Prerelease v${{ steps.get_version.outputs.VERSION }}
        prerelease: true
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
